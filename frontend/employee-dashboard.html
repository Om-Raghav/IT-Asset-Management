<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITAMS | My Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebar"></aside>

  <div class="main-content">
    <header id="topbar"></header>

    <main class="page-body">
      <div class="card card-panel p-3 mb-4" id="welcomeCard">
        <div class="d-flex align-items-center gap-3">
          <div class="stat-icon" style="background:#2f5aff;"><i class="bi bi-person-fill"></i></div>
          <div>
            <h5 class="mb-0 fw-bold" id="welcomeName">Welcome</h5>
            <div class="text-muted small" id="welcomeMeta">Loading your profile...</div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-laptop me-2"></i>My Assigned Assets</h5>
      </div>
      <div id="myAssetsContainer" class="row g-3 mb-4">
        <div class="col-12 text-muted">Loading your assets...</div>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card card-panel p-3">
            <h6 class="fw-bold mb-3"><i class="bi bi-wrench-adjustable me-2"></i>My Reported Issues</h6>
            <div id="myRepairsList" class="small">Loading...</div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card card-panel p-3">
            <h6 class="fw-bold mb-3"><i class="bi bi-bell me-2"></i>My Notifications</h6>
            <div id="myNotificationsList" class="small">Loading...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Report Issue Modal -->
<div class="modal fade" id="reportIssueModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="reportIssueForm">
        <div class="modal-header">
          <h5 class="modal-title">Report an Issue</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="assignmentId" id="reportAssignmentId">
          <p class="text-muted small mb-3" id="reportAssetLabel"></p>
          <div class="mb-3">
            <label class="form-label">Describe the issue *</label>
            <textarea class="form-control" name="issueDescription" rows="3" required placeholder="e.g. Laptop screen flickers on startup"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Report</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Request Return Modal -->
<div class="modal fade" id="requestReturnModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="requestReturnForm">
        <div class="modal-header">
          <h5 class="modal-title">Request Asset Return</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="assignmentId" id="returnAssignmentId">
          <p class="text-muted small mb-3" id="returnAssetLabel"></p>
          <div class="mb-3">
            <label class="form-label">Remarks (optional)</label>
            <textarea class="form-control" name="remarks" rows="2" placeholder="Any notes for IT"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Request</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/chat-widget.js"></script>
<script src="js/employee-dashboard.js"></script>
<script>renderLayout('employee-dashboard.html');</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITAMS | Assets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebar"></aside>
  <div class="main-content">
    <header id="topbar"></header>
    <main class="page-body">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="mb-0 fw-bold">Assets</h4>
        <div class="d-flex gap-2">
          <input type="text" id="assetSearch" class="form-control form-control-sm" placeholder="Search assets..." style="width:220px;">
          <select id="statusFilter" class="form-select form-select-sm" style="width:160px;">
            <option value="">All Status</option>
            <option value="Available">Available</option>
            <option value="Assigned">Assigned</option>
            <option value="In Repair">In Repair</option>
            <option value="Retired">Retired</option>
            <option value="Scrapped">Scrapped</option>
          </select>
          <button class="btn btn-sm btn-primary" id="addAssetBtn"><i class="bi bi-plus-lg me-1"></i>Add Asset</button>
        </div>
      </div>

      <div class="card card-panel">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Tag</th><th>Name</th><th>Category</th><th>Vendor</th>
                <th>Status</th><th>Warranty Expiry</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="assetTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="assetModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="assetForm">
        <div class="modal-header">
          <h5 class="modal-title" id="assetModalLabel">Add Asset</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Asset Tag *</label>
              <div class="input-group">
                <input type="text" class="form-control" name="assetTag" id="assetTagInput" required>
                <button type="button" class="btn btn-outline-secondary" id="generateTagBtn" title="Generate tag from Vendor + Category">
                  <i class="bi bi-magic"></i> Generate
                </button>
              </div>
              <div class="form-text">Pick a Vendor and Category below, then click Generate for an auto tag like <code>DEL-LAP-0001</code>.</div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Asset Name *</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Category *</label>
              <select class="form-select" name="category" id="categorySelect" required></select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Vendor</label>
              <select class="form-select" name="vendor" id="vendorSelect"></select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Location</label>
              <select class="form-select" name="location" id="locationSelect"></select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Brand</label>
              <input type="text" class="form-control" name="brand">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" name="model">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Serial Number</label>
              <input type="text" class="form-control" name="serialNumber">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Purchase Date</label>
              <input type="date" class="form-control" name="purchaseDate">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Purchase Cost</label>
              <input type="number" step="any" class="form-control" name="purchaseCost">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Warranty Expiry</label>
              <input type="date" class="form-control" name="warrantyExpiry">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option>Available</option><option>Assigned</option><option>In Repair</option>
                <option>Retired</option><option>Scrapped</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Condition</label>
              <select class="form-select" name="condition">
                <option>New</option><option>Good</option><option>Fair</option><option>Poor</option>
              </select>
            </div>
            <div class="col-12 mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Asset</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/chat-widget.js"></script>
<script src="js/assets.js"></script>
<script>renderLayout('assets.html');</script>
</body>
</html>

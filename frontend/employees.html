<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITAMS | Employees</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebar"></aside>

  <div class="main-content">
    <header id="topbar"></header>

    <main class="page-body">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="mb-0 fw-bold" id="pageTitle">Employees</h4>
        <div class="d-flex gap-2">
          <input type="text" id="crudSearch" class="form-control form-control-sm" placeholder="Search..." style="width:220px;">
          <button class="btn btn-sm btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add</button>
        </div>
      </div>

      <div class="card card-panel">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead id="crudTableHead"></thead>
            <tbody id="crudTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="crudModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="crudForm">
        <div class="modal-header">
          <h5 class="modal-title" id="crudModalLabel">Add Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="crudFormFields"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Create Login Modal -->
<div class="modal fade" id="createLoginModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="createLoginForm">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-key-fill me-2"></i>Create Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="loginEmployeeId">
          <p class="text-muted small mb-3" id="loginEmployeeLabel"></p>
          <div class="mb-3">
            <label class="form-label">Login Email *</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="text" class="form-control" id="loginPassword" placeholder="Leave blank to auto-generate">
            <div class="form-text">If left blank, a temporary password is generated and shown once below.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" id="loginRole">
              <option value="Employee" selected>Employee</option>
              <option value="Manager">Manager</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div id="createLoginResult" class="d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-success">Create Login</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reset Password Modal (for employees who already have a login but forgot it) -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="resetPasswordForm">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-arrow-repeat me-2"></i>Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="resetEmployeeId">
          <p class="text-muted small mb-3" id="resetEmployeeLabel"></p>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="text" class="form-control" id="resetPassword" placeholder="Leave blank to auto-generate">
            <div class="form-text">If left blank, a temporary password is generated and shown once below.</div>
          </div>
          <div id="resetPasswordResult" class="d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-warning">Reset Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/chat-widget.js"></script>
<script src="js/crud-common.js"></script>
<script src="js/employees.js"></script>
<script>renderLayout('employees.html');</script>
</body>
</html>

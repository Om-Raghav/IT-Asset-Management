<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITAMS | Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebar"></aside>
  <div class="main-content">
    <header id="topbar"></header>
    <main class="page-body">
      <h4 class="fw-bold mb-3">Dashboard</h4>

      <div class="alert alert-primary d-flex align-items-center" id="smartSummaryBox">
        <i class="bi bi-robot fs-4 me-2"></i>
        <span id="smartSummaryText">Loading smart summary...</span>
      </div>

      <div class="row g-3 mb-4" id="statCards"></div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card card-panel p-3">
            <h6 class="fw-bold mb-3">Assets by Status</h6>
            <div id="statusList"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card card-panel p-3">
            <h6 class="fw-bold mb-3">Assets by Category</h6>
            <div id="categoryList"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/chat-widget.js"></script>
<script src="js/dashboard.js"></script>
<script>renderLayout('dashboard.html');</script>
</body>
</html>
